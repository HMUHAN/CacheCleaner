name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile
        shell: pwsh
        run: |
          Write-Host "cwd = $(Get-Location)"
          Get-ChildItem -Force | Select-Object Name | Format-Table | Out-String | Write-Host
          if (Test-Path src) { Get-ChildItem src | Select-Object Name,Length | Format-Table | Out-String | Write-Host }

          $root = (Get-Location).Path
          $src = Join-Path $root 'src\QQCacheTray.cs'
          $ico = Join-Path $root 'assets\QQCacheTray.ico'
          $manifest = Join-Path $root 'app.manifest'

          foreach ($p in @($src, $ico, $manifest)) {
            if (-not (Test-Path $p)) { throw "missing: $p" }
          }

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }

          Write-Host "csc = $csc"
          Write-Host "src = $src"

          $cscArgs = @(
            '/nologo',
            '/target:winexe',
            '/codepage:65001',
            '/optimize+',
            "/win32icon:$ico",
            "/win32manifest:$manifest",
            "/out:$root\QQCacheTray.exe",
            '/r:System.dll',
            '/r:System.Core.dll',
            '/r:System.Drawing.dll',
            '/r:System.Windows.Forms.dll',
            $src
          )

          & $csc @cscArgs > build.log 2>&1
          $code = $LASTEXITCODE
          Get-Content build.log

          if ($code -ne 0) { throw "csc failed: $code" }
          if (-not (Test-Path "$root\QQCacheTray.exe")) { throw "exe not produced" }

      - name: Version and hash
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') { $ver = $Matches[1] } else { $ver = "0.0.0" }
          $sha = (Get-FileHash QQCacheTray.exe -Algorithm SHA256).Hash.ToLower()
          "VERSION=$ver" >> $env:GITHUB_ENV
          "SHA256=$sha" >> $env:GITHUB_ENV
          Write-Host "version=$ver"
          Write-Host "sha256=$sha"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item QQCacheTray.exe payload\
          Copy-Item assets\QQCacheTray.ico payload\
          Copy-Item README.md payload\
          Compress-Archive -Path payload\* -DestinationPath "CacheCleaner-$env:VERSION.zip" -Force
          Get-Item "CacheCleaner-$env:VERSION.zip" | Format-List Name,Length

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QQCacheTray.exe
            CacheCleaner-*.zip
          generate_release_notes: true
          body: |
            **首次使用**：下载 `CacheCleaner-*.zip`，解压到任意文件夹后运行 `QQCacheTray.exe`。

            **更新**：下载 `QQCacheTray.exe` 覆盖旧文件即可（程序内「立即更新」用的也是这个文件）。

            - 需要管理员权限（会弹 UAC）
            - `data\` 会在 exe 同级目录生成，解压到文件夹可避免把配置丢在桌面上

      - name: Update latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $json = [ordered]@{
            version = $env:VERSION
            url = "https://github.com/$repo/releases/download/$tag/QQCacheTray.exe"
            sha256 = $env:SHA256
            notes = "see release page"
          } | ConvertTo-Json

          Set-Content -Path latest.json -Value $json -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore: update latest.json for $tag"
          git push origin HEAD:main
